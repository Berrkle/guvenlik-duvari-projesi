# =====================================================================
#  NovaTek Holding - Londra Ofisi - FortiGate 90G (HA cifti)
#  Ornek FortiOS 7.x konfigurasyonu (egitim amacli, kisaltilmistir)
#  Temel sablon (sertlestirme, SNMPv3, loglama) FortiManager'dan gelir.
#  ISDB (Internet Service Database) nesne adlari surume gore dogrulanmalidir.
# =====================================================================

config system global
    set hostname "LON-FW-01"
    set admintimeout 10
    set strong-crypto enable
    set timezone "Europe/London"
end

config firewall address
    edit "LON_PERSONEL_NET"
        set subnet 10.30.20.0 255.255.255.0
    next
    edit "LON_MISAFIR_NET"
        set subnet 10.30.70.0 255.255.255.0
    next
    edit "IST_DC"
        set subnet 10.10.40.10 255.255.255.254
    next
    edit "IST_ERP"
        set subnet 10.10.40.20 255.255.255.255
    next
end

# ---------- Yerel cikis: M365 dogrudan internete ----------
config firewall policy
    edit 9
        set name "M365-SaaS-Yerel-Cikis"
        set srcintf "vlan20_personel"
        set dstintf "virtual-wan-link"
        set srcaddr "LON_PERSONEL_NET"
        set internet-service enable
        set internet-service-name "Microsoft-Office365"
        set action accept
        set schedule "always"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set ips-sensor "default"
        set logtraffic all
        set nat enable
    next
    edit 6
        set name "Hub-AD-ERP"
        set srcintf "vlan20_personel"
        set dstintf "VPN_IST"
        set srcaddr "LON_PERSONEL_NET"
        set dstaddr "IST_DC" "IST_ERP"
        set action accept
        set schedule "always"
        set service "KERBEROS" "LDAP" "HTTPS"
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
    next
    edit 12
        set name "Personel-Internet"
        set srcintf "vlan20_personel"
        set dstintf "virtual-wan-link"
        set srcaddr "LON_PERSONEL_NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS"
        set utm-status enable
        set ssl-ssh-profile "LON-deep-inspection-gdpr"
        set av-profile "default"
        set webfilter-profile "default"
        set dnsfilter-profile "default"
        set ips-sensor "default"
        set application-list "default"
        set logtraffic all
        set nat enable
    next
    edit 999
        set name "Tumunu-Reddet"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

# ---------- GDPR: saglik/finans kategorileri SSL incelemeden muaf ----------
# Kategori numaralari FortiGuard web filtre tablosuna gore dogrulanmalidir.
config firewall ssl-ssh-profile
    edit "LON-deep-inspection-gdpr"
        config https
            set ports 443
            set status deep-inspection
        end
        config ssl-exempt
            edit 1
                set fortiguard-category 31
                # 31 = Finance and Banking
            next
            edit 2
                set fortiguard-category 33
                # 33 = Health and Wellness
            next
        end
    next
end

config log fortianalyzer setting
    set status enable
    set server "10.10.40.50"
    set reliable enable
    # FortiAnalyzer tarafinda Londra cihazlari ayri ADOM'a (LON-GDPR) atanir
end
