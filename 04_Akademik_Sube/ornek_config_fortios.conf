# =====================================================================
#  NovaTek Holding - Akademik Sube - FortiGate 900G (HA cifti)
#  Ornek FortiOS 7.x konfigurasyonu (egitim amacli, kisaltilmistir)
#  Temel sablon (sertlestirme, SNMPv3, NTP) FortiManager'dan gelir.
# =====================================================================

config system global
    set hostname "AKD-FW-01"
    set admintimeout 10
    set strong-crypto enable
end

# ---------- Arayuzler (25 GbE uplink, LACP) ----------
config system interface
    edit "agg_core"
        set type aggregate
        set member "x1" "x2"
        set lacp-mode active
    next
    edit "vlan100_ogrenci"
        set interface "agg_core"
        set vlanid 100
        set ip 10.100.0.1 255.255.0.0
        set allowaccess ping
    next
    edit "vlan110_akademisyen"
        set interface "agg_core"
        set vlanid 110
        set ip 10.40.110.1 255.255.252.0
        set allowaccess ping
    next
    edit "vlan130_sinav"
        set interface "agg_core"
        set vlanid 130
        set ip 10.40.130.1 255.255.255.0
    next
    edit "vlan80_dmz"
        set interface "agg_core"
        set vlanid 80
        set ip 10.40.80.1 255.255.255.0
    next
    edit "vlan40_sunucu"
        set interface "agg_core"
        set vlanid 40
        set ip 10.40.40.1 255.255.252.0
    next
end

# ---------- SD-WAN: iki 10G hat aktif-aktif ----------
config system sdwan
    set status enable
    config members
        edit 1
            set interface "wan1"
            set gateway 203.0.113.33
        next
        edit 2
            set interface "wan2"
            set gateway 198.51.100.33
        next
    end
    config service
        edit 1
            set name "Ogrenci-Yuk-Dengeleme"
            set mode load-balance
            set src "AKD_OGRENCI_NET"
            set dst "all"
            set priority-members 1 2
        next
    end
end

# ---------- Adresler ve takvimler ----------
config firewall address
    edit "AKD_OGRENCI_NET"
        set subnet 10.100.0.0 255.255.0.0
    next
    edit "AKD_AKADEMISYEN_NET"
        set subnet 10.40.110.0 255.255.252.0
    next
    edit "AKD_SINAV_NET"
        set subnet 10.40.130.0 255.255.255.0
    next
    edit "AKD_SINAV_SUNUCU"
        set subnet 10.40.40.50 255.255.255.255
    next
    edit "AKD_DMZ_NET"
        set subnet 10.40.80.0 255.255.255.0
    next
    edit "AKD_IC_AGLAR"
        set subnet 10.40.0.0 255.255.0.0
    next
end

config firewall schedule recurring
    edit "Sinav_Saatleri"
        set day monday tuesday wednesday thursday friday saturday
        set start 08:30
        set end 18:00
    next
end
# Gercek uygulamada sinav programi "schedule onetime" nesneleri olarak
# ogrenci isleri sisteminden otomatik uretilir (API ile FortiManager'a).

# ---------- Ogrenci basina bant genisligi ----------
config firewall shaper per-ip-shaper
    edit "Ogrenci_20M"
        set max-bandwidth 20000
        set bandwidth-unit kbps
        set max-concurrent-session 300
    next
    edit "Akademisyen_50M"
        set max-bandwidth 50000
    next
end

config firewall shaping-policy
    edit 1
        set name "QoS-Ogrenci"
        set srcaddr "AKD_OGRENCI_NET"
        set dstaddr "all"
        set dstintf "virtual-wan-link"
        set service "ALL"
        set per-ip-shaper "Ogrenci_20M"
    next
    edit 2
        set name "QoS-Akademisyen"
        set srcaddr "AKD_AKADEMISYEN_NET"
        set dstaddr "all"
        set dstintf "virtual-wan-link"
        set service "ALL"
        set per-ip-shaper "Akademisyen_50M"
    next
end

# ---------- Ogrenci web filtresi (5651) ----------
# Kategori numaralari FortiGuard tablosuna gore dogrulanmalidir.
config webfilter profile
    edit "OGR-5651"
        config ftgd-wf
            config filters
                edit 1
                    set category 26
                    # 26 = Malicious Websites
                    set action block
                next
                edit 2
                    set category 61
                    # 61 = Phishing
                    set action block
                next
                edit 3
                    set category 14
                    # 14 = Pornography
                    set action block
                next
                edit 4
                    set category 59
                    # 59 = Proxy Avoidance
                    set action block
                next
                edit 5
                    set category 11
                    # 11 = Gambling
                    set action block
                next
            end
        end
        set log-all-url enable
    next
end

# ---------- Ogrenci uygulama kontrolu ----------
# Kategori numaralari FortiGuard uygulama veritabanina gore dogrulanmalidir.
config application list
    edit "OGR-P2P-Tor-Proxy-Engel"
        config entries
            edit 1
                set category 2
                # P2P (BitTorrent vb.)
                set action block
            next
            edit 2
                set category 6
                # Proxy (Tor, anonimlestiriciler, kisisel VPN servisleri)
                set action block
            next
        end
    next
end

# ---------- Politikalar (secilmis) ----------
config firewall policy
    edit 10
        set name "Ogrenci-Kampus-Servisleri"
        set srcintf "vlan100_ogrenci"
        set dstintf "vlan80_dmz"
        set srcaddr "AKD_OGRENCI_NET"
        set dstaddr "AKD_DMZ_NET"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
    next
    edit 12
        set name "Ogrenci-Ic-Ag-Engel"
        set srcintf "vlan100_ogrenci"
        set dstintf "any"
        set srcaddr "AKD_OGRENCI_NET"
        set dstaddr "AKD_IC_AGLAR"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    # Kural 14 (riskli uygulama engeli): FortiGate'te uygulama tabanli engelleme
    # ayri bir deny politikasiyla degil, izin politikasina (16) bagli
    # "OGR-P2P-Tor-Proxy-Engel" uygulama kontrol profiliyle yapilir.
    # Kural 15 (port engeli) ayni sekilde 16'nin servis listesi disinda kalan
    # her sey 17/999 ile reddedildigi icin ayrica yazilmamistir.
    edit 16
        set name "Ogrenci-Internet"
        set srcintf "vlan100_ogrenci"
        set dstintf "virtual-wan-link"
        set srcaddr "AKD_OGRENCI_NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "QUIC"
        set utm-status enable
        set inspection-mode flow
        set ssl-ssh-profile "certificate-inspection"
        set webfilter-profile "OGR-5651"
        set dnsfilter-profile "default"
        set ips-sensor "default"
        set application-list "OGR-P2P-Tor-Proxy-Engel"
        set av-profile "default"
        set logtraffic all
        set nat enable
    next
    edit 30
        set name "Sinav-Sunucu"
        set srcintf "vlan130_sinav"
        set dstintf "vlan40_sunucu"
        set srcaddr "AKD_SINAV_NET"
        set dstaddr "AKD_SINAV_SUNUCU"
        set action accept
        set schedule "Sinav_Saatleri"
        set service "HTTPS"
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
    next
    edit 32
        set name "Sinav-Her-Sey-Engel"
        set srcintf "vlan130_sinav"
        set dstintf "any"
        set srcaddr "AKD_SINAV_NET"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 999
        set name "Tumunu-Reddet"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

# ---------- Kullanici tabanli loglama (802.1X / RADIUS) ----------
config user radius
    edit "AKD-NAC"
        set server "10.40.40.20"
        set rsso enable
        set rsso-endpoint-attribute User-Name
    next
end

# ---------- Loglama (5651: 2 yil arsiv FortiAnalyzer + SIEM) ----------
config log fortianalyzer setting
    set status enable
    set server "10.10.40.50"
    set reliable enable
end

config system ha
    set group-name "AKD-HA"
    set mode a-p
    set hbdev "ha1" 50 "ha2" 50
    set session-pickup enable
    set session-pickup-connectionless enable
    set monitor "wan1" "wan2" "agg_core"
end
