# =====================================================================
#  NovaTek Holding - Istanbul Genel Merkez - FortiGate 200G (HA cifti)
#  Ornek FortiOS 7.x konfigurasyonu (egitim amacli, kisaltilmistir)
#  WAN IP'leri dokumantasyon blogundandir (RFC 5737): 203.0.113.0/24, 198.51.100.0/24
#  Not: Profil/ISDB adlari FortiOS surumune gore degisebilir; uygulamadan once
#       cihaz uzerinde dogrulayin.
# =====================================================================

# ---------- 1. Sistem sertlestirme ----------
config system global
    set hostname "IST-FW-01"
    set admintimeout 10
    set admin-lockout-threshold 3
    set admin-lockout-duration 300
    set strong-crypto enable
    set admin-https-ssl-versions tlsv1-2 tlsv1-3
end

config system admin
    edit "adm-agguvenlik-01"
        set accprofile "super_admin"
        set trusthost1 10.250.10.0 255.255.255.0
        # MFA: FortiToken veya RADIUS uzerinden zorunlu
        set two-factor fortitoken
    next
end

config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "10.10.40.10"
        next
    end
end

config system snmp sysinfo
    set status enable
end
# SNMPv1/v2c topluluklari tanimlanmaz; yalnizca SNMPv3 kullanicisi
config system snmp user
    edit "zabbix-v3"
        set notify-hosts 10.10.40.70
        set security-level auth-priv
        set auth-proto sha256
        set priv-proto aes256
    next
end

# ---------- 2. Arayuzler ve VLAN'lar ----------
config system interface
    edit "wan1"
        set ip 203.0.113.10 255.255.255.248
        set allowaccess ping
        set role wan
    next
    edit "wan2"
        set ip 198.51.100.10 255.255.255.248
        set allowaccess ping
        set role wan
    next
    edit "vlan10_mgmt"
        set interface "port3"
        set vlanid 10
        set ip 10.250.10.1 255.255.255.0
        set allowaccess ping https ssh snmp
        set role lan
    next
    edit "vlan20_personel"
        set interface "port3"
        set vlanid 20
        set ip 10.10.20.1 255.255.254.0
        set allowaccess ping
        set role lan
    next
    edit "vlan30_it"
        set interface "port3"
        set vlanid 30
        set ip 10.10.30.1 255.255.255.0
        set allowaccess ping
    next
    edit "vlan40_sunucu"
        set interface "port3"
        set vlanid 40
        set ip 10.10.40.1 255.255.252.0
        set allowaccess ping
    next
    edit "vlan50_voip"
        set interface "port3"
        set vlanid 50
        set ip 10.10.50.1 255.255.255.0
    next
    edit "vlan60_iot"
        set interface "port3"
        set vlanid 60
        set ip 10.10.60.1 255.255.255.0
    next
    edit "vlan70_misafir"
        set interface "port3"
        set vlanid 70
        set ip 10.10.70.1 255.255.254.0
    next
    edit "vlan80_dmz"
        set interface "port4"
        set vlanid 80
        set ip 10.10.80.1 255.255.255.0
    next
end

# ---------- 3. SD-WAN ----------
config system sdwan
    set status enable
    config members
        edit 1
            set interface "wan1"
            set gateway 203.0.113.9
        next
        edit 2
            set interface "wan2"
            set gateway 198.51.100.9
        next
    end
    config health-check
        edit "SLA_Internet"
            set server "1.1.1.1" "8.8.8.8"
            set members 1 2
            config sla
                edit 1
                    set latency-threshold 100
                    set jitter-threshold 30
                    set packetloss-threshold 2
                next
            end
        next
    end
end

# ---------- 4. Adres nesneleri ----------
config firewall address
    edit "IST_PERSONEL_NET"
        set subnet 10.10.20.0 255.255.254.0
    next
    edit "IST_IT_NET"
        set subnet 10.10.30.0 255.255.255.0
    next
    edit "IST_SUNUCU_NET"
        set subnet 10.10.40.0 255.255.252.0
    next
    edit "IST_DC"
        set subnet 10.10.40.10 255.255.255.254
    next
    edit "IST_ERP"
        set subnet 10.10.40.20 255.255.255.255
    next
    edit "IST_DOSYA"
        set subnet 10.10.40.30 255.255.255.255
    next
    edit "IST_MISAFIR_NET"
        set subnet 10.10.70.0 255.255.254.0
    next
    edit "IT_JUMP_HOST"
        set subnet 10.250.10.10 255.255.255.255
    next
    edit "RFC1918_10"
        set subnet 10.0.0.0 255.0.0.0
    next
    edit "RFC1918_172"
        set subnet 172.16.0.0 255.240.0.0
    next
    edit "RFC1918_192"
        set subnet 192.168.0.0 255.255.0.0
    next
end

config firewall addrgrp
    edit "GRP_RFC1918"
        set member "RFC1918_10" "RFC1918_172" "RFC1918_192"
    next
end

config firewall schedule recurring
    edit "Gece_Yedekleme"
        set day sunday monday tuesday wednesday thursday friday saturday
        set start 01:00
        set end 06:00
    next
end

# ---------- 5. Guvenlik politikalari (secilmis ornekler) ----------
config firewall policy
    edit 15
        set name "Personel-AD"
        set srcintf "vlan20_personel"
        set dstintf "vlan40_sunucu"
        set srcaddr "IST_PERSONEL_NET"
        set dstaddr "IST_DC"
        set action accept
        set schedule "always"
        set service "KERBEROS" "LDAP" "LDAP_UDP" "DNS" "SMB"
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
        set comments "Sahip: IT Altyapi | Gozden gecirme: 3 ay"
    next
    edit 21
        set name "Personel-Sunucu-Diger-Engel"
        set srcintf "vlan20_personel"
        set dstintf "vlan40_sunucu"
        set srcaddr "IST_PERSONEL_NET"
        set dstaddr "IST_SUNUCU_NET"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 24
        set name "SMB-RDP-Disa-Engel"
        set srcintf "vlan20_personel" "vlan30_it" "vlan40_sunucu"
        set dstintf "virtual-wan-link"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "SMB" "RDP" "SAMBA"
        set logtraffic all
    next
    edit 27
        set name "Personel-Internet"
        set srcintf "vlan20_personel" "vlan30_it"
        set dstintf "virtual-wan-link"
        set srcaddr "IST_PERSONEL_NET" "IST_IT_NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS"
        set utm-status enable
        set inspection-mode flow
        set ssl-ssh-profile "deep-inspection"
        set av-profile "default"
        set webfilter-profile "default"
        set dnsfilter-profile "default"
        set ips-sensor "default"
        set application-list "default"
        set logtraffic all
        set nat enable
        set comments "Bankacilik/saglik kategorileri SSL profilinde muaf (KVKK)"
    next
    edit 31
        set name "Misafir-Internet"
        set srcintf "vlan70_misafir"
        set dstintf "virtual-wan-link"
        set srcaddr "IST_MISAFIR_NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set webfilter-profile "default"
        set ips-sensor "default"
        set logtraffic all
        set nat enable
    next
    edit 32
        set name "Misafir-Ic-Engel"
        set srcintf "vlan70_misafir"
        set dstintf "any"
        set srcaddr "IST_MISAFIR_NET"
        set dstaddr "GRP_RFC1918"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 999
        set name "Tumunu-Reddet"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

# ---------- 6. Trafik sekillendirme (QoS) ----------
config firewall shaper traffic-shaper
    edit "Ses_Video"
        # birim: kbps -> 400 Mbps garanti, 800 Mbps ust limit
        set guaranteed-bandwidth 400000
        set maximum-bandwidth 800000
        set priority high
    next
    edit "Toplu_Veri"
        set maximum-bandwidth 200000
        set priority low
    next
end

config firewall shaper per-ip-shaper
    edit "Misafir_5M"
        set max-bandwidth 5000
        set max-concurrent-session 200
    next
end

config firewall shaping-policy
    edit 1
        set name "QoS-Misafir"
        set srcaddr "IST_MISAFIR_NET"
        set dstaddr "all"
        set dstintf "virtual-wan-link"
        set service "ALL"
        set per-ip-shaper "Misafir_5M"
    next
end

# ---------- 7. VPN hub (ornek: Ankara tuneli) ----------
config vpn ipsec phase1-interface
    edit "VPN_ANK"
        set interface "wan1"
        set ike-version 2
        set peertype any
        set net-device disable
        set proposal aes256gcm-prfsha384
        set dhgrp 20
        set authmethod signature
        set certificate "IST_FW_CERT"
        set remote-gw 192.0.2.20
    next
end
config vpn ipsec phase2-interface
    edit "VPN_ANK_P2"
        set phase1name "VPN_ANK"
        set proposal aes256gcm
        set dhgrp 20
        set src-subnet 10.10.0.0 255.255.0.0
        set dst-subnet 10.20.0.0 255.255.0.0
    next
end

# ---------- 8. Loglama ----------
config log setting
    set fwpolicy-implicit-log enable
end
config log fortianalyzer setting
    set status enable
    set server "10.10.40.50"
    set reliable enable
end
config log syslogd setting
    set status enable
    set server "10.10.40.60"
    set mode reliable
    set port 6514
    set enc-algorithm high
end

# ---------- 9. Yuksek erisilebilirlik ----------
config system ha
    set group-name "IST-HA"
    set mode a-p
    set hbdev "ha1" 50 "ha2" 50
    set session-pickup enable
    set override disable
    set priority 200
    set monitor "wan1" "wan2" "port3"
end
