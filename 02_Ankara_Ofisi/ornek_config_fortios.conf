# =====================================================================
#  NovaTek Holding - Ankara Ofisi - FortiGate 120G (HA cifti)
#  Ornek FortiOS 7.x konfigurasyonu (egitim amacli, kisaltilmistir)
#  Sistem sertlestirme, NTP, SNMPv3 ve loglama bloklari Istanbul ile aynidir
#  (FortiManager sablonundan gelir) ve burada tekrarlanmamistir.
# =====================================================================

config system global
    set hostname "ANK-FW-01"
    set admintimeout 10
    set admin-lockout-threshold 3
    set strong-crypto enable
end

config system interface
    edit "vlan20_personel"
        set interface "port3"
        set vlanid 20
        set ip 10.20.20.1 255.255.254.0
        set allowaccess ping
    next
    edit "vlan25_kamu"
        set interface "port3"
        set vlanid 25
        set ip 10.20.25.1 255.255.255.0
        set allowaccess ping
    next
    edit "vlan70_misafir"
        set interface "port3"
        set vlanid 70
        set ip 10.20.70.1 255.255.255.0
    next
end

config firewall address
    edit "ANK_PERSONEL_NET"
        set subnet 10.20.20.0 255.255.254.0
    next
    edit "ANK_KAMU_NET"
        set subnet 10.20.25.0 255.255.255.0
    next
    edit "ANK_MISAFIR_NET"
        set subnet 10.20.70.0 255.255.255.0
    next
    edit "IST_HUB_NETS"
        set subnet 10.10.0.0 255.255.0.0
    next
    edit "ARG_NETS"
        set subnet 10.60.0.0 255.255.0.0
    next
    edit "FQDN_EKAP"
        set type fqdn
        set fqdn "ekap.kik.gov.tr"
    next
end

# ---------- Spoke -> Hub IPsec ----------
config vpn ipsec phase1-interface
    edit "VPN_IST"
        set interface "wan1"
        set ike-version 2
        set peertype any
        set net-device disable
        set proposal aes256gcm-prfsha384
        set dhgrp 20
        set authmethod signature
        set certificate "ANK_FW_CERT"
        set remote-gw 203.0.113.10
        set auto-negotiate enable
    next
end
config vpn ipsec phase2-interface
    edit "VPN_IST_P2"
        set phase1name "VPN_IST"
        set proposal aes256gcm
        set dhgrp 20
        set src-subnet 10.20.0.0 255.255.0.0
        set dst-subnet 10.10.0.0 255.255.0.0
        set auto-negotiate enable
    next
end

config router static
    edit 10
        set dst 10.10.0.0 255.255.0.0
        set device "VPN_IST"
    next
end

# ---------- Politikalar (secilmis) ----------
config firewall policy
    edit 6
        set name "Hub-AD-ERP-Dosya"
        set srcintf "vlan20_personel" "vlan25_kamu"
        set dstintf "VPN_IST"
        set srcaddr "ANK_PERSONEL_NET" "ANK_KAMU_NET"
        set dstaddr "IST_HUB_NETS"
        set action accept
        set schedule "always"
        set service "KERBEROS" "LDAP" "HTTPS" "SMB"
        set utm-status enable
        set ips-sensor "default"
        set av-profile "default"
        set logtraffic all
    next
    edit 7
        set name "ArGe-Dogrudan-Engel"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "ARG_NETS"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 8
        set name "Kamu-Portallari"
        set srcintf "vlan25_kamu"
        set dstintf "virtual-wan-link"
        set srcaddr "ANK_KAMU_NET"
        set dstaddr "FQDN_EKAP"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set ips-sensor "default"
        set av-profile "default"
        set logtraffic all
        set nat enable
        set comments "DPI yok: e-imza zinciri bozulmasin"
    next
    edit 9
        set name "Kamu-Diger-Internet-Engel"
        set srcintf "vlan25_kamu"
        set dstintf "virtual-wan-link"
        set srcaddr "ANK_KAMU_NET"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 13
        set name "Personel-Internet"
        set srcintf "vlan20_personel"
        set dstintf "virtual-wan-link"
        set srcaddr "ANK_PERSONEL_NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS"
        set utm-status enable
        set ssl-ssh-profile "deep-inspection"
        set av-profile "default"
        set webfilter-profile "default"
        set dnsfilter-profile "default"
        set ips-sensor "default"
        set application-list "default"
        set logtraffic all
        set nat enable
    next
    edit 999
        set name "Tumunu-Reddet"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

config system ha
    set group-name "ANK-HA"
    set mode a-p
    set hbdev "ha" 50 "port10" 50
    set session-pickup enable
    set monitor "wan1" "wan2" "port3"
end
